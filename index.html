<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal ChatGPT</title>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #4B5563;
            border-radius: 3px;
        }
        .typing-animation::after {
            content: '▋';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-4 max-w-4xl">
        <header class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Personal ChatGPT</h1>
            <p class="text-gray-400">Your AI assistant for everyday conversations</p>
        </header>

        <div class="chat-container h-[60vh] overflow-y-auto bg-gray-800 rounded-lg p-4 mb-4">
            <div id="chat-messages" class="space-y-4">
                <div class="flex items-start gap-4">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center">
                        <i class="bi bi-robot"></i>
                    </div>
                    <div class="bg-gray-700 rounded-lg p-3 max-w-[80%]">
                        <p>Hello! I'm your personal AI assistant. How can I help you today?</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-4">
            <div class="flex-1">
                <textarea id="user-input" class="w-full bg-gray-800 rounded-lg p-3 text-white resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Type your message here..."></textarea>
            </div>
            <div class="flex flex-col gap-2">
                <button id="send-btn" class="bg-blue-500 hover:bg-blue-600 rounded-lg px-6 py-3 font-medium transition-colors">
                    <i class="bi bi-send"></i>
                </button>
                <button id="clear-btn" class="bg-gray-700 hover:bg-gray-600 rounded-lg px-6 py-3 font-medium transition-colors">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>

        <div class="mt-4 flex gap-4 flex-wrap">
            <button class="suggestion-btn bg-gray-800 hover:bg-gray-700 rounded-lg px-4 py-2">Tell me a joke</button>
            <button class="suggestion-btn bg-gray-800 hover:bg-gray-700 rounded-lg px-4 py-2">What's the weather like?</button>
            <button class="suggestion-btn bg-gray-800 hover:bg-gray-700 rounded-lg px-4 py-2">Help me write code</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const suggestionBtns = document.querySelectorAll('.suggestion-btn');

        const responses = {
            'tell me a joke': "Why don't scientists trust atoms? Because they make up everything! 😄",
            "what's the weather like": "I'm sorry, I don't have access to real-time weather data. You might want to check a weather app or website for accurate information.",
            'help me write code': "I'd be happy to help you write code! Please specify the programming language and what you'd like to create.",
        };

        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start gap-4';
            
            const iconDiv = document.createElement('div');
            iconDiv.className = `w-8 h-8 rounded-full ${isUser ? 'bg-green-500' : 'bg-blue-500'} flex items-center justify-center`;
            iconDiv.innerHTML = `<i class="bi bi-${isUser ? 'person' : 'robot'}"></i>`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'bg-gray-700 rounded-lg p-3 max-w-[80%]';
            contentDiv.innerHTML = `<p>${message}</p>`;

            messageDiv.appendChild(iconDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function simulateTyping(message) {
            return new Promise(resolve => {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'flex items-start gap-4';
                typingDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center">
                        <i class="bi bi-robot"></i>
                    </div>
                    <div class="bg-gray-700 rounded-lg p-3">
                        <p class="typing-animation">Thinking</p>
                    </div>
                `;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                setTimeout(() => {
                    chatMessages.removeChild(typingDiv);
                    addMessage(message, false);
                    resolve();
                }, 1500);
            });
        }

        async function handleMessage(message) {
            const normalizedMessage = message.toLowerCase().trim();
            let response = responses[normalizedMessage] || "I'm not sure how to respond to that. Could you please rephrase or ask something else?";
            await simulateTyping(response);
        }

        sendBtn.addEventListener('click', async () => {
            const message = userInput.value.trim();
            if (message) {
                addMessage(message, true);
                userInput.value = '';
                await handleMessage(message);
            }
        });

        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        clearBtn.addEventListener('click', () => {
            chatMessages.innerHTML = '';
            addMessage("Hello! I'm your personal AI assistant. How can I help you today?", false);
        });

        suggestionBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                const message = btn.textContent;
                addMessage(message, true);
                await handleMessage(message.toLowerCase());
            });
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
